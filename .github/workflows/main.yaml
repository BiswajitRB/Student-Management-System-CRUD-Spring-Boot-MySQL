name: CI/CD Pipeline to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up SSH Key
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

    - name: Deploy to EC2 via SSH
      env:
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
      run: |
        ssh -o StrictHostKeyChecking=no $USER@$HOST << 'EOF'
          # Docker aur Docker Compose Setup (Agar pehle se nahi hain toh install honge)
          sudo apt-get update -y
          sudo apt-get install docker.io -y
          sudo systemctl start docker
          sudo systemctl enable docker
          sudo usermod -aG docker $USER
          sudo apt-get install docker-compose-plugin -y

          # Navigate to project directory or clone it
          if [ -d "/home/$USER/Student-Management-System-CRUD-Spring-Boot-MySQL" ]; then
            cd /home/$USER/Student-Management-System-CRUD-Spring-Boot-MySQL
            git pull origin main
          else
            git clone https://github.com/BiswajitRB/Student-Management-System-CRUD-Spring-Boot-MySQL.git \
            /home/$USER/Student-Management-System-CRUD-Spring-Boot-MySQL
            cd /home/$USER/Student-Management-System-CRUD-Spring-Boot-MySQL
          fi

          # Rebuild and restart containers using docker compose
          docker compose down || true
          docker compose up --build -d
        EOF
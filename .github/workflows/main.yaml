name: CI/CD Pipeline to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up SSH Key
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

    - name: Deploy to EC2 via SSH
      env:
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
      run: |
        ssh -o StrictHostKeyChecking=no $USER@$HOST << 'EOF'
          # 1. Check karein ki project folder pehle se hai ya nahi
          if [ -d "Student-Management-System-CRUD-Spring-Boot-MySQL" ]; then
            cd Student-Management-System-CRUD-Spring-Boot-MySQL
            git pull origin main
          else
            git clone https://github.com/BiswajitRB/Student-Management-System-CRUD-Spring-Boot-MySQL.git
            cd Student-Management-System-CRUD-Spring-Boot-MySQL
          fi

          # 2. Docker compose down aur up clean tareeqe se chalayein
          docker compose down --remove-orphans || true
          docker compose up --build -d
        EOF